[package]
name = "kunai"
version = "0.1.0"
edition = "2021"
authors = ["Mehdi <mehdilight>"]
description = "High-performance PlayStation 4 PKG extractor & shadPS4 installer for macOS (Apple Silicon native), built in Rust with extensible multi-OS architecture."
readme = "README.md"
license = "MIT"
keywords = ["ps4", "pkg", "extractor", "shadps4", "macos", "kunai"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
rsa = "0.9"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
sha2 = "0.10"
hmac = "0.12"
flate2 = "1.0"
indicatif = "0.17"
colored = "2.2"
anyhow = "1.0"
thiserror = "2.0"
byteorder = "1.5"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
